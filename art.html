    var ip = "null";
    function getIP(json) {
        console.log(json);
        try {
            ip = json.ip;
        } catch (e) {
            ip = 'unknown';
        }
        return;
    }
</script>

<script>
    // 쿠키에서 값을 가져오는 함수
    function getCookieValue(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) {
            return parts.pop().split(";").shift();
        }
    }

    // 쿠키에 값을 저장하는 함수
    function setCookieValue(name, value, days) {
        let expires = "";
        if (days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    function getUVfromCookie() {
        // 6자리 임의의 문자열 생성
        const hash = Math.random().toString(36).substring(2, 8).toUpperCase();
        // 쿠키에서 기존 해시 값을 가져옴
        const existingHash = getCookieValue("user");
        // 기존 해시 값이 없으면, 새로운 해시 값을 쿠키에 저장
        if (!existingHash) {
            setCookieValue("user", hash, 180); // 쿠키 만료일은 6개월
            return hash;
        } else {
            // 기존 해시 값이 있으면, 기존 값을 반환
            return existingHash;
        }
    }

    // Sam pading value to start with 0. eg: 01, 02, .. 09, 10, ..
    function padValue(value) {
        return (value < 10) ? "0" + value : value;
    }

    function getTimeStamp() {
        const date = new Date();

        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const seconds = date.getSeconds();

        const formattedDate = `${padValue(year)}-${padValue(month)}-${padValue(day)} ${padValue(hours)}:${padValue(minutes)}:${padValue(seconds)}`;

        return formattedDate;
    }

    var queryString = location.search;
    const urlParams = new URLSearchParams(queryString);
    const utm = urlParams.get("utm")

    var mobile = 'desktop';
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        // true for mobile device
        mobile = 'mobile';
    }

    $(document).ready(function () {

        /* data를 만들 땐 모든 field가 들어 있어야 함 */
        var data = JSON.stringify({"id": getUVfromCookie(),
                    "landingUrl":window.location.href,
                    "ip":ip,
                    "referer":document.referrer,
                    "time_stamp":getTimeStamp(),
                    "utm":utm,
                    "device":mobile,"variant":window.ABV}
                    );

        addrScript = 'https://script.google.com/macros/s/AKfycbzRHn5D6rnWMTDd0HYZ2gMOMjXU1KR1xi3buvUXjKp0HOkR16c68oRwsz7Y--hvPqDp/exec';

        axios.get(addrScript+'?action=insert&table=visitors&data='+encodeURIComponent(data))
            .then(response => {
                console.log(JSON.stringify(response));
            })
    });
</script>

<style>

.hero .t{display:flex;align-items:flex-end;gap:14px;margin:8px 0 6px;flex-wrap:wrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}

.chips button.lk{color:#9AA0AB;background:#F7F8F9;border-style:dashed}
.locked{margin:18px 0;padding:34px 20px;text-align:center;border:1px dashed #D3D6DC;border-radius:18px;background:repeating-linear-gradient(-45deg,rgba(110,118,132,.05) 0 .6px,transparent .6px 7px),#FBFBFC}

.sec h2{display:flex;align-items:center;gap:8px;font-size:15px;margin:22px 0 10px}
.sec h2 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in;box-shadow:0 4px 14px rgba(30,40,60,.06);transition:transform .15s,box-shadow .2s}
